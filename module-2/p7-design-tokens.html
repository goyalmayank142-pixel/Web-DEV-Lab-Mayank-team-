<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P7: Design Tokens & Typography System</title>
  <style>
    /* Design Tokens: CSS Custom Properties */
    :root {
      /* Colors */
      --color-primary: #2563eb;
      --color-primary-dark: #1d4ed8;
      --color-surface: #ffffff;
      --color-background: #f8fafc;
      --color-text-main: #0f172a;
      --color-text-muted: #64748b;
      --color-border: #e2e8f0;

      /* Typography Scale */
      --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.25rem;
      --font-size-xl: 1.5rem;
      --font-size-2xl: 2rem;
      --line-height-tight: 1.25;
      --line-height-normal: 1.5;
      --line-height-relaxed: 1.75;

      /* Spacing Scale */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --space-8: 2rem;

      /* Radii & Shadows */
      --radius-md: 8px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    body {
      background-color: var(--color-background);
      color: var(--color-text-main);
      font-family: var(--font-family-base);
      font-size: var(--font-size-base);
      line-height: var(--line-height-normal);
      margin: 0;
      padding: var(--space-8);
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: var(--space-6);
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: var(--font-size-2xl);
      line-height: var(--line-height-tight);
      margin-bottom: var(--space-2);
      color: var(--color-primary);
    }

    p.lead {
      font-size: var(--font-size-lg);
      color: var(--color-text-muted);
      line-height: var(--line-height-relaxed);
    }

    .btn {
      display: inline-block;
      background: var(--color-primary);
      color: white;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
      text-decoration: none;
      font-weight: 600;
    }
    .btn:hover {
      background: var(--color-primary-dark);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Design Token System</h1>
    <p class="lead">Design tokens encapsulate visual design attributes into maintainable CSS variables.</p>
    <p>By establishing semantic tokens for color palettes, spacing scales, and typographical rhythm, stylesheets stay consistent, accessible, and trivial to re-theme.</p>
    <a href="#" class="btn">Explore Design Tokens</a>
  </div>
</body>
</html>
